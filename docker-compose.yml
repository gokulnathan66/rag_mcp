version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.13.3
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rag-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-mcp-server
    ports:
      - "8000:8000"
    environment:
      # FastMCP Configuration
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-csv-rag-server}
      - MCP_VERSION=${MCP_VERSION:-1.0.0}
      
      # CSV Configuration
      - CSV_DATA_DIRECTORY=/app/data
      - CSV_DELIMITER=${CSV_DELIMITER:-,}
      - CSV_ENCODING=${CSV_ENCODING:-utf-8}
      
      # Qdrant Configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-csv_documents}
      
      # FastEmbed Configuration
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - ENABLE_SPARSE_EMBEDDINGS=${ENABLE_SPARSE_EMBEDDINGS:-false}
      
      # Processing Configuration
      - MAX_CHUNK_SIZE=${MAX_CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-10}
      
      # Monitoring Configuration
      - ENABLE_LOGFIRE=${ENABLE_LOGFIRE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount CSV data directory (read-only for security)
      - ./data:/app/data:ro
      # Optional: Mount credentials if needed
      # - ./credentials.json:/app/credentials.json:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-web-ui
    ports:
      - "8001:8000"
    environment:
      # CSV Configuration
      - CSV_DATA_DIRECTORY=/app/data
      - CSV_DELIMITER=${CSV_DELIMITER:-,}
      - CSV_ENCODING=${CSV_ENCODING:-utf-8}
      
      # Qdrant Configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-csv_documents}
      
      # FastEmbed Configuration
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      
      # Processing Configuration
      - MAX_CHUNK_SIZE=${MAX_CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
      
      # Monitoring Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount CSV data directory (writable for uploads)
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    command: python -m app.web_server
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
