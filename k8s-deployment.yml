# Kubernetes deployment manifest for RAG MCP Server with HTTP transport
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-mcp-server
  labels:
    app: rag-mcp-server
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rag-mcp-server
  template:
    metadata:
      labels:
        app: rag-mcp-server
        version: v1.0.0
    spec:
      containers:
      - name: rag-mcp-server
        image: rag-mcp-server:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        # Transport Configuration
        - name: TRANSPORT_MODE
          value: "http"
        - name: HTTP_HOST
          value: "0.0.0.0"
        - name: HTTP_PORT
          value: "8000"
        - name: MAX_CONCURRENT_CONNECTIONS
          value: "100"
        - name: CONNECTION_TIMEOUT
          value: "300"
        - name: REQUEST_TIMEOUT
          value: "60"
        - name: ENABLE_CORS
          value: "true"
        - name: CORS_ORIGINS
          value: "*"
        - name: ENABLE_HEALTH_ENDPOINT
          value: "true"
        - name: HEALTH_CHECK_PATH
          value: "/health"
        
        # Application Configuration
        - name: MCP_SERVER_NAME
          value: "csv-rag-server"
        - name: MCP_VERSION
          value: "1.0.0"
        - name: CSV_DATA_DIRECTORY
          value: "/app/data"
        - name: QDRANT_URL
          value: "http://qdrant:6333"
        - name: QDRANT_COLLECTION_NAME
          value: "csv_documents"
        - name: EMBEDDING_MODEL_NAME
          value: "sentence-transformers/all-MiniLM-L6-v2"
        - name: ENABLE_LOGFIRE
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        
        # Resource limits and requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        # Readiness probe - checks if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Startup probe - gives container time to start up
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12  # Allow up to 2 minutes for startup
          successThreshold: 1
        
        # Graceful shutdown configuration
        terminationGracePeriodSeconds: 30
        
        # Volume mounts for data
        volumeMounts:
        - name: csv-data
          mountPath: /app/data
          readOnly: true
      
      # Volumes
      volumes:
      - name: csv-data
        configMap:
          name: csv-data-config
          optional: true
      
      # Pod-level configuration
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# Service to expose the deployment
apiVersion: v1
kind: Service
metadata:
  name: rag-mcp-service
  labels:
    app: rag-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: rag-mcp-server

---
# Horizontal Pod Autoscaler for scaling based on CPU/memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-mcp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-mcp-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Pod Disruption Budget to ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-mcp-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rag-mcp-server